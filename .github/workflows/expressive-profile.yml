name: Expressive Profile
on:
  schedule:
    # Twice a day: 05:17 and 17:17 UTC (12:17 and 00:17 Asia/Jakarta).
    - cron: '17 5,17 * * *'
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .github/workflows/expressive-profile.yml
permissions:
  contents: write
concurrency:
  group: expressive-profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: metawka/expressive-profile@0dacdd6b4cd8d649b71ace733afbfe1b92649955
        with:
          token: ${{ github.token }}
          commit-message: 'Update Material 3 Expressive profile cards'
      - name: Polish the generated cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .profile/fix-hero.py
          python3 .profile/fix-stats.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || {
            git commit -m "chore: polish generated cards"
            git pull --rebase --quiet
            git push
          }
